# ============================================================================
# LOCATIONS
# floor: basement | ground | first | second | attic | outdoor
# zone:  state_rooms | family_private | guest | nursery | service | servant_quarters |
#        outbuilding | grounds | abbey_public | abbey_enclosure | village | exit
# access (default rule; see spec for the full matrix):
#   upstairs   - family and guests; servants only on duty and unseen when possible
#   private    - owner plus named personal servants
#   downstairs - servants; family only by exception
#   shared     - anyone with business there
#   enclosure  - monks only (guests by invitation of the abbot)
#   public     - open to all
# ============================================================================

locations:

  # ------------------------------------------------ HOUSE: GROUND FLOOR STATE ROOMS
  - id: front_portico
    name: Front portico
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [carriage_sweep, entrance_hall]
    description: Columned main entrance. Family and guests arrive here; servants never use it.

  - id: entrance_hall
    name: Entrance hall
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [front_portico, grand_staircase, saloon, library, dining_room, morning_room, study, gentlemens_corridor, private_chapel, green_baize_door]
    description: Marble-floored hall with a fireplace and the hall porter's chair. Callers wait here and the household lines up here to greet important arrivals.

  - id: grand_staircase
    name: Grand staircase
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [entrance_hall, first_floor_gallery]
    description: Main stair hung with family portraits. Servants do not use it except to carry luggage when ordered.

  - id: saloon
    name: Saloon
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [entrance_hall, drawing_room, music_room, terrace]
    description: Great central reception room, used as the ballroom. Guests assemble here before dinner.

  - id: drawing_room
    name: Drawing room
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [saloon, conservatory, terrace]
    description: The ladies withdraw here after dinner. Afternoon tea is served here and the children are brought down at six.

  - id: music_room
    name: Music room
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [saloon]
    description: Grand piano and harp. Used for after-dinner performances by the daughters and guests.

  - id: morning_room
    name: Morning room
    domain: house
    floor: ground
    zone: family_private
    access: upstairs
    connects_to: [entrance_hall, terrace]
    description: East-facing sitting room for the ladies' mornings. The countess writes letters here.

  - id: library
    name: Library
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [entrance_hall, study]
    description: Panelled library. The gentlemen read the newspapers here, which the footmen have ironed.

  - id: study
    name: Earl's study (business room)
    domain: house
    floor: ground
    zone: family_private
    access: private
    connects_to: [entrance_hall, library, estate_office]
    description: The earl's private room for estate business. Servants are summoned here for praise or dismissal.

  - id: estate_office
    name: Estate office
    domain: house
    floor: ground
    zone: service
    access: shared
    connects_to: [study, back_courtyard]
    description: The land agent's office, with its own outside door so that tenants can pay rent without entering the house.

  - id: dining_room
    name: Dining room
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [entrance_hall, serving_room]
    description: Long table seating twenty-four, with silver and candelabra. Dinner is at eight and dress is formal.

  - id: serving_room
    name: Serving room (servery)
    domain: house
    floor: ground
    zone: service
    access: downstairs
    connects_to: [dining_room, butlers_pantry, service_corridor]
    description: Food from the distant kitchen is plated and kept warm here. Footmen wait here between courses.

  - id: gentlemens_corridor
    name: Gentlemen's corridor
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [entrance_hall, billiard_room, smoking_room, gun_room]
    description: Masculine wing of the ground floor.

  - id: billiard_room
    name: Billiard room
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [gentlemens_corridor]
    description: Full-size table. A late-night refuge for gentlemen guests.

  - id: smoking_room
    name: Smoking room
    domain: house
    floor: ground
    zone: state_rooms
    access: upstairs
    connects_to: [gentlemens_corridor]
    description: The only room where smoking is allowed. Ladies never enter.

  - id: gun_room
    name: Gun room
    domain: house
    floor: ground
    zone: service
