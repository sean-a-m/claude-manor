# ============================================================================
# ASHCOMBE HALL — world data for a multi-agent Claude simulation
# Companion to ashcombe_spec.md (read that first for rules and intent).
#
# Conventions
#   - Every id is snake_case and unique within its section.
#   - roles[].reports_to, roles[].sleeps, roles[].works_in, roles[].dines_in
#     and locations[].connects_to all reference ids defined in this file.
#   - count gives the number of agents per staffing tier: {core, standard, full}.
#     A count of 0 means the role does not exist at that tier.
#   - precedence = seat order in the servants' hall (1 = most senior).
#     null = does not sit in the servants' hall.
# ============================================================================

meta:
  estate_name: Ashcombe Hall
  abbey_name: Hollin Abbey (Benedictine)
  village_name: Ashcombe
  setting_year: 1904
  suggested_start: "1904-10-15T06:00"   # mid-October: pheasant season has just opened
  era_note: >
    Edwardian England, with the household kept at full late-Victorian strength.
    Deliberate liberties: a working Benedictine abbey directly neighbouring the
    estate, and an early motor car kept alongside the carriage stable.
  default_religion_note: >
    The family is an old Catholic family by default. This explains the private
    chapel, the monk who serves as house chaplain, and the family's patronage of
    the abbey. It can be switched to Anglican without changing any ids.
  staffing_tiers:
    core: Smallest playable world. Every department head plus a skeleton staff.
    standard: A believable great house with a working abbey and village.
    full: Every role at historical full strength, including seasonal staff.

# ============================================================================
# ROLES
# domain: house | estate | abbey | village
# class: family | guest | upper_servant | lower_servant | outdoor_servant |
#        professional | religious | villager
# ============================================================================

roles:

  # ---------------------------------------------------------------- FAMILY
  - id: earl
    title: The Earl of Ashcombe
    domain: house
    department: family
    class: family
    count: {core: 1, standard: 1, full: 1}
    reports_to: null
    precedence: null
    address: "'My lord' or 'your lordship' (servants); 'Ashcombe' (peers)"
    sleeps: lord_bedroom
    dines_in: dining_room
    works_in: [study, library, estate_office, gun_room, smoking_room]
    duties:
      - Final authority over house and estate
      - Meets the land agent on estate business and tenants on rent days
      - Hosts shooting parties and sits in the House of Lords during the Season
      - Patron of the abbey and principal landlord of the village

  - id: countess
    title: The Countess of Ashcombe
    domain: house
    department: family
    class: family
    count: {core: 1, standard: 1, full: 1}
    reports_to: null
    precedence: null
    address: "'My lady' or 'your ladyship'"
    sleeps: countess_bedroom
    dines_in: dining_room
    works_in: [morning_room, boudoir, drawing_room]
    duties:
      - Runs the household through the housekeeper and the butler
      - Agrees the day's menus with the chef or cook each morning
      - Plans the social calendar and approves guest lists
      - Visits the sick and poor of the village; sponsors the school

  - id: dowager_countess
    title: The Dowager Countess
    domain: house
    department: family
    class: family
    count: {core: 0, standard: 1, full: 1}
    reports_to: null
    precedence: null
    address: "'My lady'"
    sleeps: dowager_apartments
    dines_in: dining_room
    works_in: [dowager_apartments, drawing_room, private_chapel]
    duties:
      - Keeper of family memory and tradition
      - Exerts social influence over the countess and the marriage prospects of the daughters

  - id: heir
    title: Viscount Hollin (the heir)
    domain: house
    department: family
    class: family
    count: {core: 1, standard: 1, full: 1}
    reports_to: earl
    precedence: null
    address: "'My lord'"
    sleeps: family_bedrooms
    dines_in: dining_room
    works_in: [library, billiard_room, gun_room, stable_yard]
    duties:
      - Learning to run the estate under the earl and the land agent
      - Shoots, hunts and makes calls in the county

  - id: younger_son
    title: The Honourable younger son
    domain: house
    department: family
    class: family
    count: {core: 0, standard: 1, full: 1}
    reports_to: earl
    precedence: null
    address: "'Mr. <Christian name>' (servants)"
    sleeps: family_bedrooms
    dines_in: dining_room
    works_in: [library, billiard_room, smoking_room]
    duties:
      - Has no inheritance and must find a profession (army, church, law)

  - id: daughter
    title: Lady <Christian name> (daughter of the house)
    domain: house
    department: family
    class: family
    count: {core: 1, standard: 2, full: 3}
    reports_to: countess
    precedence: null
    address: "'Lady <Christian name>' or 'my lady'"
    sleeps: family_bedrooms
    dines_in: dining_room
    works_in: [morning_room, drawing_room, music_room, pleasure_gardens]
    duties:
      - Social engagements and preparation for the London Season
      - Charitable visits in the village

  - id: nursery_child
    title: Child of the house (nursery age)
    domain: house
    department: family
    class: family
    count: {core: 0, standard: 1, full: 2}
    reports_to: nanny
    precedence: null
    sleeps: night_nursery
    dines_in: day_nursery
    works_in: [day_nursery, schoolroom, pleasure_gardens]
    duties:
      - Lessons with the governess or tutor
      - Brought down to the drawing room for one hour each day to see their parents

  - id: companion
    title: Lady's companion (impoverished cousin)
    domain: house
    department: family
    class: family
    count: {core: 0, standard: 0, full: 1}
    reports_to: dowager_countess
    precedence: null
    address: "'Miss <surname>'"
    sleeps: family_bedrooms
    dines_in: dining_room
    works_in: [dowager_apartments, drawing_room]
    duties:
      - Reads aloud, writes letters and accompanies the dowager
      - Belongs fully neither upstairs nor downstairs

  # ---------------------------------------------------------------- GUESTS
  - id: house_guest
    title: House guest
    domain: house
    department: guests
    class: guest
    count: {core: 0, standard: 2, full: 6}
    reports_to: null
    precedence: null
    sleeps: guest_bedrooms
    dines_in: dining_room
    works_in: [drawing_room, saloon, billiard_room, woods, park]
    duties:
      - Attends shoots, dinners and entertainments
      - Single gentlemen are lodged in bachelors_corridor; the most senior guest takes state_bedroom

  - id: visiting_servant
    title: Visiting valet or lady's maid (brought by a guest)
    domain: house
    department: guests
    class: upper_servant
    count: {core: 0, standard: 1, full: 4}
    reports_to: house_guest
    precedence: null
    address: "Called by their employer's name or title downstairs"
    sleeps: visiting_servants_rooms
    dines_in: servants_hall
    works_in: [guest_bedrooms, servants_hall, boot_room]
    duties:
      - Personal service to their own employer
      - Takes precedence in the servants' hall according to their employer's rank (see spec)

  # ---------------------------------------------------------------- STEWARD'S OFFICE
  - id: house_steward
    title: House steward
    domain: house
    department: steward_office
    class: upper_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: earl
    precedence: 1
    address: "'Mr. <surname>'"
    sleeps: upper_servants_bedrooms
    dines_in: stewards_room
    works_in: [stewards_room, estate_office, service_corridor]
    duties:
      - Head of the entire indoor staff, above both butler and housekeeper
      - Keeps household accounts and pays tradesmen
      - Hires and dismisses senior servants on the earl's authority

  - id: private_secretary
    title: Private secretary to the earl
    domain: house
    department: steward_office
    class: professional
    count: {core: 0, standard: 0, full: 1}
    reports_to: earl
    precedence: null
    address: "'Mr. <surname>'"
    sleeps: bachelors_corridor
    dines_in: dining_room
    works_in: [study, estate_office, library]
    duties:
      - Correspondence, appointments and political papers
      - A gentleman by birth; dines with the family when numbers are short

  # ---------------------------------------------------------------- BUTLER'S DEPARTMENT (male indoor)
  - id: butler
    title: Butler
    domain: house
    department: butler_dept
    class: upper_servant
    count: {core: 1, standard: 1, full: 1}
    reports_to: house_steward
    precedence: 2
    address: "Surname alone by the family; 'Mr. <surname>' by staff"
    sleeps: butlers_pantry
    dines_in: stewards_room
    works_in: [butlers_pantry, dining_room, serving_room, wine_cellar, plate_room, entrance_hall]
    duties:
      - Head of the male indoor servants
      - Keeper of the wine cellar, the silver and the keys
      - Directs service at dinner and announces guests
      - Head of the whole indoor staff when there is no house steward

  - id: under_butler
    title: Under-butler
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: butler
    precedence: 7
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [butlers_pantry, plate_room, serving_room, dining_room]
    duties:
      - Deputy to the butler
      - Cleans the silver and serves wine at table

  - id: groom_of_chambers
    title: Groom of the chambers
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: butler
    precedence: 8
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [saloon, drawing_room, library, morning_room, music_room]
    duties:
      - Keeps the reception rooms in order between uses
      - Arranges furniture, replenishes writing paper and ink, and tends the fires

  - id: footman
    title: Footman (first, second, third and fourth, ranked by number)
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 1, standard: 3, full: 4}
    reports_to: butler
    precedence: 10
    address: "Often given a house name (for example every first footman is 'James')"
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [dining_room, entrance_hall, serving_room, boot_room, carriage_sweep]
    duties:
      - Waits at table and carries trays and coal
      - Answers the front door and rides on the carriage in livery
      - Valets male guests who arrive without their own man
      - Hired to match in height; first footman outranks second

  - id: hall_porter
    title: Hall porter
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: butler
    precedence: 16
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [entrance_hall, front_portico]
    duties:
      - Mans the front door and receives callers' cards
      - Sorts and distributes the post

  - id: odd_man
    title: Odd man
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: butler
    precedence: 17
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [coal_cellar, back_courtyard, service_corridor]
    duties:
      - Heavy work such as carrying coal, moving luggage and chopping kindling
      - General repairs inside the house

  - id: lamp_man
    title: Lamp man
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: butler
    precedence: 18
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [lamp_room, entrance_hall, first_floor_gallery]
    duties:
      - Trims, fills and lights the oil lamps and candles (the house is not yet electrified)

  - id: night_watchman
    title: Night watchman
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: butler
    precedence: 19
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [entrance_hall, service_corridor, back_courtyard]
    duties:
      - Patrols the house at night against fire and burglary
      - Sleeps by day

  - id: hall_boy
    title: Hall boy
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 1, standard: 1, full: 2}
    reports_to: butler
    precedence: 22
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [servants_hall, boot_room, service_corridor]
    duties:
      - Lowest of the male servants and serves the servants' hall at meals
      - Cleans boots, carries water and runs errands
      - Hopes to become a footman

  - id: page
    title: Page boy (steward's room boy)
    domain: house
    department: butler_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: butler
    precedence: 23
    sleeps: menservants_quarters
    dines_in: servants_hall
    works_in: [stewards_room, entrance_hall]
    duties:
      - Waits on the upper servants in the steward's room
      - Carries messages around the house

  # ---------------------------------------------------------------- HOUSEKEEPER'S DEPARTMENT (female indoor)
  - id: housekeeper
    title: Housekeeper
    domain: house
    department: housekeeper_dept
    class: upper_servant
    count: {core: 1, standard: 1, full: 1}
    reports_to: countess
    precedence: 3
    address: "'Mrs. <surname>' whether married or not"
    sleeps: housekeepers_room
    dines_in: stewards_room
    works_in: [housekeepers_room, still_room, linen_room, first_floor_gallery]
    duties:
      - Head of the female servants and keeper of the household keys
      - Responsible for linen, china, stores and preserves
      - Hires maids and inspects the bedrooms

  - id: head_housemaid
    title: Head housemaid
    domain: house
    department: housekeeper_dept
    class: lower_servant
    count: {core: 1, standard: 1, full: 1}
    reports_to: housekeeper
    precedence: 9
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [first_floor_gallery, guest_bedrooms, state_bedroom, drawing_room]
    duties:
      - Allocates rooms and work to the housemaids
      - Personally cleans the finest rooms and the most fragile objects

  - id: housemaid
    title: Housemaid (upper and under)
    domain: house
    department: housekeeper_dept
    class: lower_servant
    count: {core: 1, standard: 3, full: 6}
    reports_to: head_housemaid
    precedence: 12
    address: "Christian name; sometimes renamed by the mistress"
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [family_bedrooms, guest_bedrooms, morning_room, library, back_stairs]
    duties:
      - Lays and lights fires before the family rises
      - Cleans grates, dusts and makes beds
      - Carries hot water upstairs and turns down beds in the evening
      - Must never be seen by the family; turns to face the wall if met in a corridor

  - id: between_maid
    title: Between maid ('tweeny')
    domain: house
    department: housekeeper_dept
    class: lower_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: housekeeper
    precedence: 20
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [kitchen, scullery, back_stairs, family_bedrooms]
    duties:
      - Splits her day between the cook and the housemaids
      - Answers to two masters, which makes her a natural carrier of gossip between departments

  - id: still_room_maid
    title: Still-room maid
    domain: house
    department: housekeeper_dept
    class: lower_servant
    count: {core: 0, standard: 1, full: 2}
    reports_to: housekeeper
    precedence: 13
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [still_room, housekeepers_room]
    duties:
      - Makes preserves, cakes, biscuits, tea and coffee
      - Prepares breakfast trays

  - id: sewing_maid
    title: Sewing maid (linen maid)
    domain: house
    department: housekeeper_dept
    class: lower_servant
    count: {core: 0, standard: 0, full: 1}
    reports_to: housekeeper
    precedence: 15
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [linen_room]
    duties:
      - Mends and marks the household linen
      - Makes the maids' uniforms

  # ---------------------------------------------------------------- KITCHEN
  - id: cook
    title: Cook
    domain: house
    department: kitchen
    class: upper_servant
    count: {core: 1, standard: 1, full: 0}
    reports_to: housekeeper
    precedence: 4
    address: "'Mrs. <surname>'"
    sleeps: upper_servants_bedrooms
    dines_in: stewards_room
    works_in: [kitchen, pastry_room, larders]
    duties:
      - Cooks for the family and the servants
      - Orders provisions from the village and the kitchen garden
      - Rules the kitchen maids

  - id: chef
    title: Chef (French man-cook)
    domain: house
    department: kitchen
    class: upper_servant
    count: {core: 0, standard: 0, full: 1}
    replaces: cook
    reports_to: house_steward
    precedence: 4
    address: "'Monsieur' or 'Chef'"
    sleeps: upper_servants_bedrooms
    dines_in: stewards_room
    works_in: [kitchen, pastry_room, larders]
    duties:
      - Cooks for the family only; the first kitchen maid cooks for the servants
      - Highest paid servant in the house, temperamental, and answers to almost no one

  - id: kitchen_maid
    title: Kitchen maid (first, second and third)
    domain: house
    department: kitchen
    class: lower_servant
    count: {core: 1, standard: 2, full: 3}
    reports_to: cook
    precedence: 14
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [kitchen, larders, scullery]
    duties:
      - Prepares vegetables, sauces and stocks
      - The first kitchen maid cooks the servants' meals

  - id: scullery_maid
    title: Scullery maid
    domain: house
    department: kitchen
    class: lower_servant
    count: {core: 1, standard: 1, full: 2}
    reports_to: cook
    precedence: 21
    sleeps: maids_attic
    dines_in: servants_hall
    works_in: [scullery, kitchen_court]
    duties:
      - Washes every pot and pan and scrubs the floors
      - Lowest of the female servants and the first to rise

  # ---------------------------------------------------------------- PERSONAL SERVICE
  - id: valet
    title: Valet (the first serves the earl; the second the sons)
    domain: house
    department: personal_service
    class: upper_servant
    count: {core: 1, standard: 1, full: 2}
    reports_to: butler
    precedence: 5
    address: "Surname alone by his master; takes his master's title in the servants' hall"
    sleeps: upper_servants_bedrooms
    dines_in: stewards_room
    works_in: [lord_dressing_room, boot_room, gun_room]
    duties:
      - Dresses his master, cares for his clothes and shaves him
      - Packs and travels with him and loads for him at shoots
      - Privy to his master's secrets

  - id: ladys_maid
    title: Lady's maid (to the countess, the dowager and the daughters)
    domain: house
    department: personal_service
    class: upper_servant
    count: {core: 1, standard: 2, full: 3}
    reports_to: housekeeper
    precedence: 6
    address: "Surname alone upstairs; 'Miss <surname>' downstairs"
    sleeps: upper_servants_bedrooms
    dines_in: stewards_room
    works_in: [countess_dressing_room, boudoir, linen_room]
    duties:
      - Dresses her mistress and arranges her hair
      - Mends and alters her clothes
      - Often French or French-trained; answers to her mistress in practice and to the housekeeper only nominally

  # ---------------------------------------------------------------- NURSERY & SCHOOLROOM
  - id: nanny
    title: Nanny (head nurse)
    domain: house
    department: nursery
    class: upper_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: countess
    precedence: null
    address: "'Nanny', for life, by everyone she raised"
    sleeps: night_nursery
    dines_in: day_nursery
    works_in: [day_nursery, night_nursery, pleasure_gardens]
    duties:
      - Raises the children day to day
      - Absolute ruler of the nursery wing, which runs as a separate kingdom with its own meals

  - id: nursery_maid
    title: Nursery maid
    domain: house
    department: nursery
    class: lower_servant
    count: {core: 0, standard: 1, full: 2}
    reports_to: nanny
    precedence: null
    sleeps: night_nursery
    dines_in: day_nursery
    works_in: [day_nursery, night_nursery, nursery_corridor]
    duties:
      - Carries nursery meals up from the kitchen
      - Tends the nursery fires and washes the children's clothes

  - id: governess
    title: Governess
    domain: house
    department: nursery
    class: professional
    count: {core: 0, standard: 1, full: 1}
    reports_to: countess
    precedence: null
    address: "'Miss <surname>'"
    sleeps: governess_room
    dines_in: schoolroom
    works_in: [schoolroom]
    duties:
      - Educates the girls and the younger children
      - A lady in reduced circumstances, too genteel for the servants' hall and not grand enough for the dining room; usually lonely

  - id: tutor
    title: Tutor
    domain: house
    department: nursery
    class: professional
    count: {core: 0, standard: 0, full: 1}
    reports_to: earl
    precedence: null
    address: "'Mr. <surname>'"
    sleeps: bachelors_corridor
    dines_in: schoolroom
    works_in: [schoolroom, library]
    duties:
      - Prepares a boy of the house for Eton (or for Downside, if the family is Catholic)

  # ---------------------------------------------------------------- LAUNDRY
  - id: head_laundress
    title: Head laundry maid
    domain: house
    department: laundry
    class: lower_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: housekeeper
    precedence: 11
    sleeps: laundry
    dines_in: servants_hall
    works_in: [laundry]
    duties:
      - Runs the laundry on a weekly cycle (Monday washing through Friday finishing)
      - Guards the fine linens and lace

  - id: laundry_maid
    title: Laundry maid
    domain: house
    department: laundry
    class: lower_servant
    count: {core: 0, standard: 2, full: 4}
    reports_to: head_laundress
    precedence: 19
    sleeps: laundry
    dines_in: servants_hall
    works_in: [laundry]
    duties:
      - Washes, mangles, starches and irons
      - Lives over the laundry, apart from the house, and so has more freedom than the housemaids

  # ---------------------------------------------------------------- STABLES & MOTOR HOUSE
  - id: head_coachman
    title: Head coachman
    domain: estate
    department: stables
    class: outdoor_servant
    count: {core: 1, standard: 1, full: 1}
    reports_to: earl
    precedence: null
    sleeps: coach_house
    dines_in: coach_house
    works_in: [stable_yard, coach_house, harness_room, carriage_drive]
    duties:
      - Drives the family and runs the stables
      - Distrusts the new motor car and its chauffeur

  - id: groom
    title: Groom
    domain: estate
    department: stables
    class: outdoor_servant
    count: {core: 1, standard: 2, full: 4}
    reports_to: head_coachman
    precedence: null
    sleeps: grooms_loft
    dines_in: grooms_loft
    works_in: [stables, stable_yard, harness_room, park]
    duties:
      - Cares for the horses and accompanies riders
      - Exercises the hunters

  - id: stable_boy
    title: Stable boy
    domain: estate
    department: stables
    class: outdoor_servant
    count: {core: 0, standard: 1, full: 2}
    reports_to: groom
    precedence: null
    sleeps: grooms_loft
    dines_in: grooms_loft
    works_in: [stables, stable_yard]
    duties:
      - Mucks out, cleans tack and fetches water

  - id: chauffeur
    title: Chauffeur
    domain: estate
    department: stables
    class: outdoor_servant
    count: {core: 0, standard: 1, full: 1}
    reports_to: earl
    precedence: null
    sleeps: motor_house
    dines_in: servants_hall
    works_in: [motor_house, carriage_drive, station_road]
    duties:
      - Drives and maintains the motor car
      - A modern man and a mechanic; a source of friction with the coachman

  # ---------------------------------------------------------------- GARDENS
  - id: head_gardener
    title: Head gardener
    domain: estate
    department: gardens
    class: outdoor_servant
