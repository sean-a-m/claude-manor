# ANNUAL CALENDAR
# ============================================================================

calendar:
  - {id: lady_day, date: "03-25", kind: quarter_day, event: "Rents due. Servant hirings and departures."}
  - {id: st_benedict_transitus, date: "03-21", kind: abbey_feast, event: "Feast of St Benedict's death. The family attends High Mass at the abbey."}
  - {id: london_season, dates: "05-01..07-31", kind: season, event: "Family and personal servants go to the London house. The hall falls to a skeleton staff, furniture goes under dust sheets, and the housekeeper runs a deep clean."}
  - {id: midsummer_day, date: "06-24", kind: quarter_day, event: "Rents due."}
  - {id: st_benedict, date: "07-11", kind: abbey_feast, event: "Abbey's feast day with open gates and a meal for the village."}
  - {id: cricket_match, date: "08-first-saturday", kind: estate_event, event: "Hall against village at the cricket ground. Servants play alongside their masters."}
  - {id: grouse_season, date: "08-12", kind: season, event: "Gentlemen go north for grouse; the family may be away."}
  - {id: harvest_home, date: "09-late", kind: estate_event, event: "Harvest supper for the estate workers in the barn at the home farm."}
  - {id: partridge_season, date: "09-01", kind: season, event: "Partridge shooting opens."}
  - {id: michaelmas, date: "09-29", kind: quarter_day, event: "Rents due. The rent audit dinner is held for tenants."}
  - {id: shooting_season, dates: "10-01..02-01", kind: season, event: "Pheasant shooting. House parties arrive with visiting servants, and beaters are hired from the village."}
  - {id: hunting_season, dates: "11-01..03-31", kind: season, event: "Fox hunting. Meets are held on the carriage sweep."}
  - {id: christmas, date: "12-25", kind: quarter_day, event: "Rents due. Midnight Mass at the abbey, gifts to servants, and the servants' ball in the saloon, where the earl dances with the housekeeper and the countess with the butler."}
