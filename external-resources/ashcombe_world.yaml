# ============================================================================
# DAILY SCHEDULE (weekday, country, family in residence)
# track: servants | family | abbey | outdoor | village
# ============================================================================

daily_schedule:
  - {time: "04:30", track: abbey, event: "Rise. Vigils in the abbey church (bell)."}
  - {time: "05:30", track: servants, event: "Scullery and kitchen maids rise and light the kitchen range."}
  - {time: "06:00", track: servants, event: "Housemaids rise and clean and light the downstairs grates before the family wakes."}
  - {time: "06:00", track: outdoor, event: "Stable yard at work. Gardeners begin in the pleasure grounds so as to be gone before the family is about."}
  - {time: "06:30", track: abbey, event: "Lauds, followed by conventual Mass."}
  - {time: "07:00", track: servants, event: "Footmen lay the breakfast and iron the newspapers. Valets and maids prepare clothes and hot water."}
  - {time: "07:30", track: servants, event: "Servants' breakfast in the servants' hall."}
  - {time: "08:00", track: family, event: "Early tea and hot water carried up. The family rises and dresses."}
  - {time: "08:00", track: village, event: "Shops open and the school bell rings."}
  - {time: "08:30", track: family, event: "Family prayers in the chapel, with servants attending at the rear, said by the monk-chaplain."}
  - {time: "09:00", track: family, event: "Breakfast in the dining room, served buffet-style from the sideboard. Married ladies take a tray in bed."}
  - {time: "09:15", track: abbey, event: "Terce, then the morning work period."}
  - {time: "10:00", track: family, event: "The countess sees the chef or cook about menus and the housekeeper about the household. The earl sees the land agent."}
  - {time: "10:00", track: servants, event: "Housemaids do the bedrooms while the family is downstairs."}
  - {time: "12:00", track: abbey, event: "Sext, then dinner in the refectory in silence with reading."}
  - {time: "12:00", track: servants, event: "Servants' dinner, the main meal. Upper servants process to the steward's room for pudding."}
  - {time: "13:00", track: family, event: "Luncheon."}
  - {time: "14:00", track: family, event: "Afternoon calls, riding, walks, shooting (in season) or charity visits to the village."}
  - {time: "14:30", track: abbey, event: "None, then the afternoon work period."}
  - {time: "16:30", track: family, event: "Tea in the drawing room. The ladies change into tea gowns."}
  - {time: "17:30", track: abbey, event: "Vespers."}
  - {time: "18:00", track: family, event: "Children brought down to the drawing room for one hour."}
  - {time: "18:30", track: servants, event: "Servants' supper. The lamp man lights the lamps; housemaids turn down the beds and fill the hot-water cans."}
  - {time: "19:00", track: family, event: "Dressing gong. The family dresses for dinner with valets and maids in attendance."}
  - {time: "19:30", track: abbey, event: "Supper, then Compline. The Great Silence begins until morning."}
  - {time: "20:00", track: family, event: "Dinner of seven to nine courses, served by the butler and footmen."}
  - {time: "21:30", track: family, event: "Ladies withdraw to the drawing room; gentlemen stay for port, then join them."}
  - {time: "22:00", track: village, event: "Last orders at the Ashcombe Arms."}
  - {time: "22:30", track: servants, event: "Junior servants to bed. The housekeeper locks the maids' corridor."}
  - {time: "23:30", track: family, event: "Family and guests retire. Valets and maids undress their employers, and gentlemen may play billiards late."}
  - {time: "00:00", track: servants, event: "The butler locks up and the night watchman begins his rounds."}

weekly_rhythm:
  monday: Laundry washing day. The laundry is out of bounds to everyone else.
  tuesday: Laundry drying and mangling.
  wednesday: Ironing.
  thursday: Most common servants' half-day off (afternoon only, in rotation).
  friday: Laundry returned and checked against the books by the housekeeper.
  saturday: Wages paid monthly or quarterly. Market day in the county town; the carrier makes the run.
  sunday: Mass in the chapel or the abbey church. No shooting. Lighter work and cold supper. One Sunday afternoon a month is free for each servant.

